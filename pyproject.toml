[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "phoenix-eid-server"
version = "0.1.0.dev0"
description = "Open-source test eID server for Phoenix and the AusweisApp SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }
authors = [{ name = "Phoenix ePassport Simulator contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Zimphi/Phoenix-eID-Server"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

